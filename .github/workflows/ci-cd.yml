name: Pipeline CI/CD - Cidades ESG (.NET)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build Automatizado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore ./src/MeuProjeto.csproj

      - name: Build da aplicação
        run: dotnet build ./src/MeuProjeto.csproj --no-restore -c Release

  deploy_staging:
    name: Deploy em Staging
    needs: build_and_test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Simulação de Deploy (Staging)
        run: |
          echo "✅ Build passou!"
          echo "🚀 Realizando deploy no ambiente de STAGING..."
          echo "Iniciando os containers com docker-compose up -d"

  deploy_production:
    name: Deploy em Produção
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Simulação de Deploy (Produção)
        run: |
          echo "✅ Validação em Staging concluída!"
          echo "🚀 Realizando deploy no ambiente de PRODUÇÃO..."
          echo "Iniciando os containers de produção..."
version: '3.8'

services:
  api:
    build: .
    container_name: cidades_esg_api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=esg_db;Username=postgres;Password=admin
    depends_on:
      - db
    networks:
      - esg_network

  db:
    image: postgres:15-alpine
    container_name: cidades_esg_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: esg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - esg_network

networks:
  esg_network:
    driver: bridge

volumes:
  pgdata: